name: CI

# Build and test both projects on every push to master and on every pull request.
# This workflow never touches a secret and never publishes, so it is safe to run on
# pull requests from forks. A release can only ship code that this workflow accepts.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # postinstall installs the client/ and server/ workspaces used by the build and by vsce.
      - run: npm ci

      - name: Type-check
        run: npm run check-types

      # The build's tsconfig is `include: ["src"]`, so `check-types` never sees test/. Vitest compiles
      # tests with esbuild, which ignores types entirely, meaning nothing else in this pipeline would
      # notice a test tree that stopped type-checking. It had silently rotted to 109 errors before this
      # step existed. Deliberately not part of `package`: test types have no bearing on the shipped
      # bundle, and gating a release on them would only block hotfixes.
      - name: Type-check tests
        run: npm run check-types:test

      - name: Lint
        run: npm run lint

      # The bundles have to exist before the tests run. Four suites drive the built server over
      # stdio and skip themselves when it is missing, so until now they had never run in CI.
      - name: Build bundles
        run: node esbuild.mjs

      - name: Server unit tests
        run: npm run test:server

      # Prove the lint command works as a command, not only from a test runner, and keep a sample
      # report on the run for a reviewer to read. The fixture mod carries errors on purpose, so
      # exit code 1 is the expected answer. The report is deliberately not uploaded to code
      # scanning: these are a fixture's findings, and they would show up as this repository's own.
      - name: Lint the fixture mod
        run: |
          FIXTURE=server/test/cli/fixtures/lint-mod
          GAME=server/test/fixtures/workspace/Data
          CODE=0
          node out/server/src/cli/lint.mjs "$FIXTURE" --game "$GAME" --scope allFiles || CODE=$?
          if [ "$CODE" != "1" ]; then
            echo "::error::The fixture mod carries errors, so exit code 1 was expected, not $CODE"
            exit 1
          fi
          node out/server/src/cli/lint.mjs "$FIXTURE" --game "$GAME" --scope allFiles             --format sarif --fail-on none --quiet --out lint.sarif
          node -e "const log = JSON.parse(require('fs').readFileSync('lint.sarif', 'utf8')); if (log.version !== '2.1.0' || log.runs[0].results.length === 0) { console.error('::error::The SARIF report is empty or not 2.1.0'); process.exit(1); }"

      # The load check answers with an exit code and nothing else, so the code itself is asserted
      # here rather than only from a test runner. The three fixture mods carry one of each answer
      # on purpose: one the game would refuse to load, one it loads, and one whose single action
      # cannot be judged at all. The fake Data tree in the repository stands in for the game, since
      # the game's own data cannot be copied into a build service.
      - name: Check the fixture mods load
        run: |
          GAME=server/test/fixtures/workspace/Data
          expect_code() {
            EXPECTED=$1
            shift
            CODE=0
            node out/server/src/cli/lint.mjs "$@" --assert-loads --game "$GAME" --quiet > /dev/null || CODE=$?
            if [ "$CODE" != "$EXPECTED" ]; then
              echo "::error::$* answered with exit code $CODE, not $EXPECTED"
              exit 1
            fi
          }
          expect_code 1 server/test/cli/fixtures/assert-mod
          expect_code 0 server/test/cli/fixtures/assert-clean-mod
          expect_code 6 server/test/cli/fixtures/assert-unsure-mod
          expect_code 0 server/test/cli/fixtures/assert-unsure-mod --allow-unverifiable

      - uses: actions/upload-artifact@v6
        with:
          name: lint-sarif
          path: lint.sarif
          if-no-files-found: error

      # Packaging runs vscode:prepublish (check-types + lint + production esbuild) and proves the
      # extension is publishable. The VSIX is uploaded so it can be inspected from the run.
      - name: Package VSIX
        run: npx --yes @vscode/vsce package -o cosmoteer-language-server.vsix

      - uses: actions/upload-artifact@v6
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error

  jetbrains:
    name: JetBrains plugin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # The plugin sandbox bundles the esbuild server output, so build it before Gradle runs.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build server bundle
        run: node esbuild.mjs --production

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # buildPlugin compiles and assembles the distributable zip. Full plugin verification (which
      # downloads IntelliJ IDEA + Rider) runs in the release workflow before any publish.
      - name: Build plugin
        working-directory: jetbrains
        run: ./gradlew buildPlugin

      - uses: actions/upload-artifact@v6
        with:
          name: plugin-zip
          path: jetbrains/build/distributions/*.zip
          if-no-files-found: error
